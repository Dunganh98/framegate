[project]
name = "framegate"
version = "0.8.0"
description = "Spec-driven, test-first workflow orchestrator for Claude Code, with deterministic gates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# the .NET adapter's diff coverage runs diff-cover from framegate's own environment
dotnet = ["diff-cover>=9"]

[project.scripts]
framegate = "framegate.cli:main"

[project.entry-points.pytest11]
framegate = "framegate.pytest_plugin"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "diff-cover>=9",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/framegate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# slow tests (real dotnet builds) are deselected by default; run them with -m slow,
# everything with -m "slow or not slow"
addopts = "-q -m 'not slow'"
markers = ["slow: needs a real toolchain (dotnet) and takes minutes"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
