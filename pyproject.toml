[project]
name = "agentflow"
version = "0.1.0"
description = "Spec-driven, test-first workflow orchestrator for Claude Code, with deterministic gates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
agentflow = "agentflow.cli:main"

[project.entry-points.pytest11]
agentflow = "agentflow.pytest_plugin"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "diff-cover>=9",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
