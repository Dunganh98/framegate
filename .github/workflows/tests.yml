# The whole suite, on every push and pull request. It is not run on a developer machine
# (about ten minutes here, over an hour on a laptop with slow process starts): locally only
# the tests around a change run. A release is tagged from a commit this workflow passed.
name: tests
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - name: git identity (the tests make commits in temporary repositories)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - name: Install
        run: uv sync
      - name: Lint, format, types
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run mypy src
          uv run python ci/check_rules.py ci/allowlist.txt src tests tools ci
      - name: Tests (everything but the `slow` ones, which need WSL / dotnet builds)
        run: uv run pytest -m "not slow" -q -n auto --durations=15 --junitxml=report.xml
      - name: Failed tests as annotations (readable without the log)
        if: failure()
        shell: bash
        run: |
          uv run python - <<'EOF'
          import pathlib, xml.etree.ElementTree as ET
          p = pathlib.Path("report.xml")
          if not p.is_file():
              raise SystemExit("no report.xml")
          esc = lambda s: s.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          bad = []
          for case in ET.parse(p).getroot().iter("testcase"):
              for kind in ("failure", "error"):
                  node = case.find(kind)
                  if node is not None:
                      name = f"{case.get('classname')}::{case.get('name')}"
                      bad.append((name, (node.get("message") or "") + "\n" + (node.text or "")))
          print(f"::error title={len(bad)} failed::" + esc("\n".join(n for n, _ in bad)))
          for name, text in bad[:8]:
              print(f"::error title={name}::" + esc(text[-3000:]))
          EOF
      - name: Plugin hook tests
        working-directory: plugin
        run: node --test
