# agentflow configuration. Every key is optional; the values shown are the defaults.

[project]
language = "{language}"            # "python" | "dotnet" | "generic" (any language, [generic])
# knowledge = ".agentflow/project.md"  # project knowledge: read by the spec dialogue and
#                                  # the agents; `agentflow learn` adds accepted retro facts

[paths]
# src = "src"
# tests = "tests"
# review_tests = "tests/review"
# specs = "specs"
# out = "out"
# metrics = "metrics"
# phase_file = ".phase"
# reqs_file = ".reqs"

# [env]
# python = ".venv/Scripts/python.exe"   # python adapter: default = .venv interpreter, else current
# wsl_distro = "Ubuntu"            # WSL distribution for mutation_runner = "wsl" (default: WSL's default)

[agents]
# claude = "claude"                # override with env AGENTFLOW_CLAUDE
# max_attempts = 3                 # implementation attempts per step before it is parked
# max_turns = 80                   # one turn cap for all phases; default per phase: TESTS 50,
#                                  # TEST_REVIEW 30, IMPLEMENT 80, REVIEW 40, TRIAGE 30, PR 30,
#                                  # RETRO 30
#                                  # (API round trips; the result's num_turns runs higher)
# max_budget_usd = 2.0             # one cost cap (USD) per agent run for all phases; default per
#                                  # phase: TESTS 2.0, TEST_REVIEW 1.5, IMPLEMENT 1.5, REVIEW 1.5,
#                                  # TRIAGE 1.5, PR 1.5, RETRO 3.0; 0 = no cap
# test_review_rounds = 2           # test reviewer objections sent back to the test writer
#                                  # (per gate cycle) before the tests gate
# permission_mode = "acceptEdits"
# model = ""                       # one `claude --model` for all phases; default per phase:
#                                  # "sonnet" for TESTS, IMPLEMENT, SPEC_UPDATE, PR (they follow
#                                  # the approved spec / frozen tests); "opus" for TEST_REVIEW,
#                                  # REVIEW, TRIAGE, RETRO (the checkers); "" = Claude Code's own
# effort = ""                      # one `claude --effort` (low|medium|high|xhigh|max); "" = default
# diagnose_after = 2               # same checks failing this many attempts in a row -> a
#                                  # diagnosis run (root cause + one proposed fix); 0 = off
# step_batch_ids = 15              # consecutive plan steps share one implementer run while their
#                                  # spec IDs add up to at most this; 0 = one run per step

[gates]
# tests = "defer"                  # tests gate: "defer" = never stop, its questions, objections
#                                  # and failed checks go to the final gate (gates: spec, final);
#                                  # "human" = always stop; "auto" = pass without a stop when
#                                  # the checks pass, the test reviewer has no objections and
#                                  # no question is open (else stop as "human")
# diff_coverage = 90
# mutation_score = 80
# mutation_tool = "mutmut"         # default: mutmut (python), stryker (dotnet); "none" = off
# mutation_runner = "auto"         # python: "auto" (WSL on Windows if available, else native),
#                                  # "native" or "wsl" (mutmut needs fork: no native Windows)
# coverage_scope = "feature"       # final coverage on the feature's tests (spec IDs + review
#                                  # tests) + the whole suite once without coverage; "suite" =
#                                  # the whole suite with coverage (slow on big suites)
# mutation_scope = "feature"       # tests the mutation run uses: "feature" | "suite"
# regression_timeout = 3600        # seconds for the uninstrumented whole-suite run
# coverage_timeout = 1800          # seconds per coverage run; killed -> "ERROR: test run incomplete"
# mutation_timeout = 3600          # seconds per mutation run (same)
# format_fix = true                # the gates format the changed source files (and review
#                                  # tests; the test writer's files after its runs) before checking
#                                  # (only with the adapter's own format check)
# extra_timeout = 1800             # seconds per [gates.extra] check

# [gates.extra]                    # project checks run after the final gates and shown at the
#                                  # final gate with their exit code and output; never blocking
# readcheck = ["dotnet", "run", "--project", "tools/ReadCheck", "--", "--quick"]

# [gates.commands]                 # override the adapter's commands; [] disables one
#                                  # (python examples; dotnet: see docs/adapters.md)
# lint = ["ruff", "check", "{src}", "{tests}"]
# format = ["ruff", "format", "--check", "{src}", "{tests}"]
# typecheck = ["python", "-m", "mypy", "{src}"]
# imports = ["lint-imports"]

[protected]
# extra = ["config/", "data/reference/"]   # added to the core + adapter protected paths
# exceptions = ["tests/review/"]           # default: [paths] review_tests

# [frame]
# forbidden_patterns = [...]       # replaces the adapter's suppression patterns

# [spec]
# id_pattern = '\b[A-Z][A-Z0-9]{1,9}-[REI]-\d{3}\b'

# [phases.IMPLEMENT]
# write = ["src/", "out/"]         # PreToolUse write permissions for the phase
# tools = [...]                    # replaces the --allowedTools list for the phase
# max_turns = 80                   # turn cap of the phase's agent runs (wins over [agents])
# max_budget_usd = 1.5             # cost cap (USD) per agent run of the phase (wins over [agents])
# model = "opus"                   # `claude --model` of the phase (wins over [agents])
# effort = "high"                  # `claude --effort` of the phase (wins over [agents])

[git]
# base = "main"                    # `agentflow spec <f>` creates branch <branch_prefix><f> from it
# branch_prefix = "feat/"
# branch = true                    # false: spec stays on the current branch

[notify]
# toast = true                     # Windows toast at each gate, DONE and on error (env
#                                  # AGENTFLOW_TOAST=0 turns it off); no-op on other systems

# [roles]
# extra_dir = ".agentflow/roles"   # <phase>.md files appended to the base role prompts
