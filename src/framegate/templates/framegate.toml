# framegate configuration. Every key is optional; the values shown are the defaults.

[project]
language = "{language}"            # "python" | "dotnet" | "generic" (any language, [generic])
# knowledge = ".framegate/project.md"  # project knowledge: read by the spec dialogue and
#                                  # the agents; `framegate learn` adds accepted retro facts

[paths]
# src = "src"                      # one folder, or a list: ["core", "autoload", "scenes"]
# tests = "tests"
# review_tests = "tests/review"
# specs = "specs"
# out = "out"
# metrics = "metrics"
# phase_file = ".phase"
# reqs_file = ".reqs"

# [env]
# python = ".venv/Scripts/python.exe"   # python adapter: default = .venv interpreter, else current
# wsl_distro = "Ubuntu"            # WSL distribution for mutation_runner = "wsl" (default: WSL's default)
# refresh = ["python", "-m", "pip", "install", "-e", ".", "--no-deps"]
#                                  # run by approve-spec before it commits ("python" = the project
#                                  # interpreter): the environment follows the setup files the spec
#                                  # phase changed (a new package imports); a failure refuses the approval

[agents]
# claude = "claude"                # override with env FRAMEGATE_CLAUDE
# max_attempts = 3                 # implementation attempts per step before it is parked
# max_turns = 80                   # one turn cap for all phases; default per phase: TESTS 50,
#                                  # TEST_REVIEW 30, IMPLEMENT 80, REVIEW 40, TRIAGE 30, PR 30,
#                                  # RETRO 30
#                                  # (API round trips; the result's num_turns runs higher)
# max_budget_usd = 2.0             # one cost cap (USD) per agent run for all phases; default per
#                                  # phase: TESTS 2.0, TEST_REVIEW 1.5, IMPLEMENT 1.5, REVIEW 1.5,
#                                  # TRIAGE 1.5, PR 1.5, RETRO 3.0; 0 = no cap
# test_review_rounds = 2           # test reviewer objections sent back to the test writer
#                                  # (per gate cycle) before the tests gate
# permission_mode = "acceptEdits"
# model = ""                       # one `claude --model` for all phases; default per phase:
#                                  # "sonnet" for TESTS, IMPLEMENT, SPEC_UPDATE, PR (they follow
#                                  # the approved spec / frozen tests); "opus" for TEST_REVIEW,
#                                  # REVIEW, TRIAGE, RETRO (the checkers); "" = Claude Code's own
# effort = ""                      # one `claude --effort` (low|medium|high|xhigh|max); "" = default
# diagnose_after = 2               # same checks failing this many attempts in a row -> a
#                                  # diagnosis run (root cause + one proposed fix); 0 = off
# limit_wait_max_hours = 6         # usage limit hit: wait for the reset and run again (no
#                                  # failed attempt) if it is at most this far away; later
#                                  # (weekly limit): stop, resume with `framegate run`; 0 = stop
# step_batch_ids = 15             # consecutive plan steps share one implementer run while their
#                                  # spec IDs add up to at most this; 0 = one run per step

[gates]
# tests = "defer"                  # tests gate: "defer" = never stop, its questions, objections
#                                  # and failed checks go to the final gate (gates: spec, final);
#                                  # "human" = always stop; "auto" = pass without a stop when
#                                  # the checks pass, the test reviewer has no objections and
#                                  # no question is open (else stop as "human")
# final = "human"                  # final gate: "human" = always stop; "auto" = a feature the
#                                  # engine rates low risk ([risk]) is approved without a
#                                  # stop (retro, DONE; nothing is pushed). The rating is on
#                                  # every final brief and in the events either way
# final_repair = true              # failed final gates get one repair run per owner before
#                                  # you see them: code failures (lint, types, a red test) ->
#                                  # implementer; weak diff coverage / mutation -> test writer
# diff_coverage = 90
# mutation_score = 80
# mutation_tool = "mutmut"         # default: mutmut (python), stryker (dotnet); "none" = off
# mutation_runner = "auto"         # python: "auto" (WSL on Windows if available, else native),
#                                  # "native" or "wsl" (mutmut needs fork: no native Windows)
# coverage_scope = "feature"       # final coverage on the feature's tests (spec IDs + review
#                                  # tests) + the whole suite once without coverage; "suite" =
#                                  # the whole suite with coverage (slow on big suites)
# mutation_scope = "feature"       # tests the mutation run uses: "feature" | "suite"
# regression_timeout = 3600        # seconds for the uninstrumented whole-suite run
# regression_baseline = false      # true: approve-spec runs the whole suite once and records
#                                  # the tests that already fail; the final regression check
#                                  # then fails only on other failures (a suite that is not
#                                  # green on this machine, e.g. tests that need services)
# coverage_timeout = 1800          # seconds per coverage run; killed -> "ERROR: test run incomplete"
# mutation_timeout = 3600          # seconds per mutation run (same)
# format_fix = true                # the gates format the changed source files (and review
#                                  # tests; the test writer's files after its runs) before checking
#                                  # (only with the adapter's own format check)
# extra_timeout = 1800             # seconds per [gates.extra] check
# max_file_lines = 400             # a source file this feature made longer, and that is
#                                  # over this, is a numbered item at the final gate (split
#                                  # now / later); 0 = off. Every step gate and the final
#                                  # gates report the changed files' sizes (not blocking)
# step_tests = "suite"             # a step gate also runs the whole suite (the everyday
#                                  # selection: [dotnet] base_filter, [python] pytest_args),
#                                  # with the tests of this feature's later steps left out;
#                                  # "feature" = only the tests of the step's IDs (slow suite)
# unreached_assertions = true      # the final gate fails on an assertion of a new test that
#                                  # never ran in the feature's tests (`if (x) Assert...` on
#                                  # data without x); false = off

# [gates.extra]                    # project checks run after the final gates and shown at the
#                                  # final gate with their exit code and output; never blocking
# readcheck = ["dotnet", "run", "--project", "tools/ReadCheck", "--", "--quick"]

# [gates.commands]                 # override the adapter's commands; [] disables one
#                                  # (python examples; dotnet: see docs/adapters.md)
# lint = ["ruff", "check", "{src}", "{tests}"]
# format = ["ruff", "format", "--check", "{src}", "{tests}"]
# typecheck = ["python", "-m", "mypy", "{src}"]
# imports = ["lint-imports"]
# format_fix = ["python", "-m", "black", "{files}"]   # the formatter the gates apply to the
#                                  # changed files when `format` is the project's own check
#                                  # (without it a configured `format` turns the fix off)

# [python]                         # python adapter
# pytest_args = ["-m", "not integration and not slow"]   # added to every pytest run of
#                                  # framegate and to the test command the agents get

# [risk]                           # when a finished feature counts as low risk (all must
#                                  # hold; 0 = that test off). Also needed: final gates
#                                  # passed with diff coverage and mutation measured, nothing
#                                  # parked or open, no answer round, no cap hit twice
# max_changed_lines = 200          # changed source lines (added + removed)
# max_changed_files = 8
# max_removed_lines = 30           # removed lines in source files that existed before
# max_assumptions = 3              # assumptions the implementer logged
# min_features = 3                 # finished features in this repository (metrics file)
# never_auto = ["src/billing/", "*.sql"]   # a change here is never low risk

[docs]
# code_map = "docs/code-map.md"    # living code map: per module its purpose, key classes, how
#                                  # they work together, where to look for X (/framegate:setup
#                                  # drafts it; the PR phase updates what a feature touched)

[protected]
# extra = ["ci/", "deploy/", "config/"]    # added to the core + adapter protected paths:
#                                  # deploy, CI, generated files. Locked always, also in the
#                                  # spec phase (no feature changes them; what a feature needs
#                                  # there goes to the spec's "Pipeline follow-up" and is done
#                                  # as a separate step). Only framegate.toml and the
#                                  # language's packaging / test / tool-config files
#                                  # (pyproject.toml, pytest.ini, ruff.toml, *.csproj, ...) are
#                                  # setup files: writable in the spec phase, committed by
#                                  # approve-spec, frozen from then on; listing one of them
#                                  # here does not change that.
# exceptions = ["tests/review/"]           # default: [paths] review_tests

# [frame]
# forbidden_patterns = [...]       # replaces the adapter's suppression patterns

# [spec]
# id_pattern = '\b[A-Z][A-Z0-9]{1,9}-[REI]-\d{3}\b'

# [phases.IMPLEMENT]
# write = ["src/", "out/"]         # PreToolUse write permissions for the phase
# tools = [...]                    # replaces the --allowedTools list for the phase
# max_turns = 80                   # turn cap of the phase's agent runs (wins over [agents])
# max_budget_usd = 1.5             # cost cap (USD) per agent run of the phase (wins over [agents])
# model = "opus"                   # `claude --model` of the phase (wins over [agents])
# effort = "high"                  # `claude --effort` of the phase (wins over [agents])

[git]
# base = "main"                    # `framegate spec <f>` creates branch <branch_prefix><f> from it
# branch_prefix = "feat/"
# branch = true                    # false: spec stays on the current branch
# markers = "refs"                 # spec-approved/<f>, tests-approved/<f>, ... as private refs
#                                  # (refs/<name>; no push ever publishes them); "tags" = git
#                                  # tags, for a CI job that runs `framegate gates`
#                                  # (git push --tags)

[notify]
# toast = true                     # Windows toast at each gate, DONE and on error (env
#                                  # FRAMEGATE_TOAST=0 turns it off); no-op on other systems

# [roles]
# extra_dir = ".framegate/roles"   # <phase>.md files appended to the base role prompts

# [references]                     # other projects on this machine the agents may READ (never
#                                  # write): name = path (absolute, or relative to this file).
#                                  # A spec lists the ones its feature uses (requirements.md,
#                                  # "References"; a port also "Ported from"); approve-spec
#                                  # pins their commit, a run warns when it moved. A missing
#                                  # folder is a doctor WARN (paths differ per machine)
# otto = { path = "../da-otto", note = "the runner this repository ports" }
# core = "../da-core"
